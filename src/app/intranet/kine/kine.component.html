<router-outlet></router-outlet>
@if(u){
<section class="accueil">
  @for (card of accueilKine; track card) {
    <article class="cartel">
      <div>
        <h2>{{ card.title }}</h2>
        <p>{{ card.text }}</p>
        <a [routerLink]="card.url">
          <button>{{ card.button }}</button>
        </a>
      </div>
      <figure>
        <div [style.background-image]="'url(' + sanity.urlFor(card.image).url() + ')'" alt="Image d'illustration">
        </div>
      </figure>
    </article>
  }
</section>
}
@else{
<footer>
    @for (bottom of bottoms; track bottom) {
    <a [routerLink] ="[bottom.url]" (click)="onNavItemClick(bottom)">
      <section [ngStyle]="{'filter': bottom.active ? 'none' : 'opacity(50%)'}">
        <img [src]="bottom.image" alt="image d'exercice" />
        <article>
          <h1>{{ bottom.titre}}</h1>
          <p>{{ bottom.info }}</p>
        </article>
      </section>
    </a>
  }
</footer>
}
